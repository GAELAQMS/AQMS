<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-size:14px}
#hd{height:86px;border-bottom:3px solid;padding:7px 18px;display:-ms-flexbox;display:flex;-ms-flex-align:center;align-items:center}
#hd img{height:70px;border-radius:6px;display:block}
#hd img.qg{background:#fff;padding:3px;margin-left:10px;border:1px solid #cbd5e1}
.hl{width:290px;-ms-flex:none;flex:none;display:-ms-flexbox;display:flex;-ms-flex-align:center;align-items:center}
.ht{-ms-flex:1;flex:1;text-align:center;min-width:0}
.ht h1{margin:0;font-size:22px;letter-spacing:2px;white-space:nowrap}
.ht h2{margin:3px 0 0;font-size:14px;letter-spacing:1.5px;font-weight:600;white-space:nowrap}
.ht p{margin:3px 0 0;font-size:13px}
.hr{width:290px;-ms-flex:none;flex:none;display:-ms-flexbox;display:flex;-ms-flex-pack:end;justify-content:flex-end}
table.hi{border-collapse:collapse;font-size:13px}
.hi td{padding:1px 4px;white-space:nowrap;text-align:left}
.hi td.v{font-weight:bold}
#wrap{display:-ms-flexbox;display:flex;height:calc(100% - 86px)}
#side{width:220px;border-right:1px solid;padding:12px 10px;overflow:auto;-ms-flex:none;flex:none}
#content{-ms-flex:1;flex:1;padding:14px;overflow-y:auto;overflow-x:hidden;min-width:0}
.lbl{font-size:12px;font-weight:bold;letter-spacing:1px;margin:14px 4px 7px}
.nv,.sn{padding:10px 12px;margin-bottom:5px;border-radius:8px;cursor:pointer;border:1px solid;font-size:14px;font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:5px;margin-right:8px}
.sn b{float:right;font-size:13px}
.panel{border:1px solid;border-radius:12px;padding:14px;margin-bottom:14px}
.panel h3{margin:0 0 10px;font-size:14px;letter-spacing:1px;font-weight:bold}
.row{display:-ms-flexbox;display:flex}
.cp{width:280px;-ms-flex:none;flex:none;margin-right:14px;align-self:flex-start}
.fl{-ms-flex:1;flex:1;min-width:0}
table.cal{width:100%;border-collapse:separate;border-spacing:3px}
.cal th{font-size:12px;font-weight:bold;padding:3px}
.cal td{height:40px;text-align:center;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;border:1px solid transparent}
.cal td.x{background:none!important;cursor:default}.cal td.nd{opacity:.45}
.cal td i{display:block;width:7px;height:7px;border-radius:4px;margin:2px auto 0}
.nav{display:-ms-flexbox;display:flex;-ms-flex-pack:justify;justify-content:space-between;margin-bottom:8px;font-size:16px;font-weight:bold}
.btn{border:1px solid;border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:600}
.note{font-size:12px;margin-top:6px}
.cards{display:-ms-flexbox;display:flex;-ms-flex-wrap:wrap;flex-wrap:wrap;margin-bottom:4px}
.card{-ms-flex:1 1 130px;flex:1 1 130px;min-width:130px;border:1px solid;border-radius:10px;padding:10px 12px;margin:0 10px 10px 0}
.card small{letter-spacing:.5px;font-size:11px;font-weight:bold;white-space:nowrap}
.card div{font-size:22px;font-weight:bold;margin:3px 0 1px}
.card em{font-style:normal;font-size:12px}
.tw{max-height:340px;overflow:auto}
table.dt{width:100%;border-collapse:collapse}
.dt th{text-align:left;padding:7px 6px;font-weight:bold;font-size:13px;white-space:nowrap}
.dt td{padding:6px;border-bottom:1px solid;font-size:13px;white-space:nowrap}
.dt tr.avg td{font-weight:bold}
.fzh{overflow:hidden}.fzb{max-height:400px;overflow-y:scroll;overflow-x:hidden}
table.fx{table-layout:fixed;width:100%}.fx th,.fx td{text-align:center;padding:5px 1px}.fx th{font-size:11px;line-height:14px;padding:5px 0}.fx th small{font-size:10px;font-weight:normal}
.gr{display:-ms-flexbox;display:flex;-ms-flex-wrap:wrap;flex-wrap:wrap;margin:0 -5px}
.gc{padding:5px}
.gc>div.in{border:1px solid;border-radius:10px;padding:8px}
.gt{font-size:14px;font-weight:bold;margin-bottom:2px}
.ci{width:68px;border:1px solid;border-radius:4px;padding:3px;font-size:13px}
input,select,textarea{border:1px solid;border-radius:5px;padding:5px 6px;font-size:13px}
svg text{font-family:"Segoe UI",Arial,sans-serif;font-weight:600}
.lg span{margin-right:16px;font-size:13px;font-weight:600}
</style>

var GID=0;
function chart(ser,lab,L,j,W,H,sm,title){
  var l=sm?50:58,r=14,tp=title?44:14,b=sm?46:56,i,p,lo=1e99,hi=-1e99,v,s,n=lab.length,ok=false,bar=(ser.length==1),g=++GID,fs=sm?11:13,sl,pd,bw,x,y,st2;
  for(i=0;i<ser.length;i++)for(p=0;p<n;p++){v=ser[i].v[p];if(v===null)continue;ok=true;if(v<lo)lo=v;if(v>hi)hi=v}
  if(!ok)return'<div class="note">No data</div>';
  sl=(L!==null&&L<=hi*2.5+1e-9);if(sl&&L>hi)hi=L;
  if(bar){lo=0;hi=hi*1.12}else{if(sl&&L<lo)lo=L;pd=(hi-lo)*0.12||Math.abs(hi)*0.1||1;lo=lo-pd;if(lo<0&&lo+pd>=0)lo=0;hi=hi+pd}
  if(hi<=lo)hi=lo+1;
  bw=(W-l-r)/n;
  function X(q){return l+bw*(q+0.5)}
  function Y(q){return tp+(H-tp-b)*(1-(q-lo)/(hi-lo))}
  function fy(q){var d=hi-lo;return d<0.1?q.toFixed(4):(d<2?q.toFixed(2):(d<20?q.toFixed(1):Math.round(q)))}
  s='<div style="position:relative;width:100%;padding-bottom:'+(H/W*100)+'%"><svg style="position:absolute;left:0;top:0;width:100%;height:100%" viewBox="0 0 '+W+' '+H+'">';
  s+='<defs><linearGradient id="gb'+g+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+ser[0].c+'"/><stop offset="1" stop-color="#0b2540"/></linearGradient><linearGradient id="gr'+g+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6b6b"/><stop offset="1" stop-color="#5a0b0b"/></linearGradient></defs>';
  s+='<rect x="1" y="1" width="'+(W-2)+'" height="'+(H-2)+'" rx="8" fill="#f1f7fc" stroke="#8cc8e8"/>';
  if(title){var tw=Math.min(W-20,title.length*(sm?7:9.6)+30);s+='<rect x="'+(W/2-tw/2)+'" y="8" width="'+tw+'" height="28" fill="#00b4d8"/><text x="'+(W/2)+'" y="28" text-anchor="middle" fill="#06223a" font-size="'+(sm?13:16)+'" font-weight="bold">'+title+'</text>'}
  for(i=0;i<=4;i++){v=lo+(hi-lo)*i/4;y=Y(v);s+='<line x1="'+l+'" x2="'+(W-r)+'" y1="'+y+'" y2="'+y+'" stroke="#cfdbe6"/><text x="'+(l-6)+'" y="'+(y+4)+'" text-anchor="end" fill="#1e293b" font-size="'+fs+'">'+fy(v)+'</text>'}
  if(n<=32)for(p=0;p<=n;p++)s+='<line x1="'+(l+bw*p)+'" x2="'+(l+bw*p)+'" y1="'+tp+'" y2="'+Y(lo)+'" stroke="#dfe8f0"/>';
  s+='<line x1="'+l+'" x2="'+(W-r)+'" y1="'+Y(lo)+'" y2="'+Y(lo)+'" stroke="#1e293b"/>';
  st2=Math.ceil(n/(sm?12:31));
  for(p=0;p<n;p+=st2){x=X(p);y=Y(lo)+14;s+='<text transform="rotate(-45 '+x+' '+y+')" x="'+x+'" y="'+y+'" text-anchor="end" fill="#1e293b" font-size="'+fs+'">'+lab[p]+'</text>'}
  if(bar){for(p=0;p<n;p++){v=ser[0].v[p];if(v===null||v<=0)continue;y=Y(v);s+='<rect x="'+(X(p)-bw*0.36)+'" y="'+y+'" width="'+(bw*0.72)+'" height="'+(Y(lo)-y)+'" fill="url(#'+(v>L?'gr':'gb')+g+')"><title>'+lab[p]+': '+v.toFixed(SN[j][3])+'</title></rect>'}}
  else for(i=0;i<ser.length;i++){var d='',pen=false;
    for(p=0;p<n;p++){v=ser[i].v[p];if(v===null){pen=false;continue}d+=(pen?'L':'M')+X(p).toFixed(1)+' '+Y(v).toFixed(1)+' ';pen=true}
    s+='<path d="'+d+'" fill="none" stroke="'+ser[i].c+'" stroke-width="2.6" stroke-linejoin="round"/>';
    for(p=0;p<n;p++){v=ser[i].v[p];if(v!==null&&n<=40)s+='<circle cx="'+X(p)+'" cy="'+Y(v)+'" r="3.2" fill="'+ser[i].c+'"><title>'+lab[p]+': '+v.toFixed(SN[j][3])+'</title></circle>'}}
  if(sl)s+='<line x1="'+l+'" x2="'+(W-r)+'" y1="'+Y(L)+'" y2="'+Y(L)+'" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6,4"/><text x="'+(W-r-4)+'" y="'+(Y(L)-5)+'" text-anchor="end" fill="#dc2626" font-size="'+fs+'" font-weight="bold">SEPA limit '+L+'</text>';
  return s+'</svg></div>';
}

/* ---------- number / date cleaning (raw text -> real numbers) ---------- */
function cl(s){return (''+(s===undefined||s===null?'':s)).replace(/[\u00a0\u2007\u2009\u202f\u200b\ufeff]/g,' ').replace(/^\s+|\s+$/g,'')}
function esc(s){return (''+s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function gv(id){var e=document.getElementById(id);return e?cl(e.value):''}
/* returns a number, null (blank / N/A / --) or NaN (cannot be read) */
function cleanNum(s){var t=cl(s),m,u,e='',ei;
  if(t==='')return null;
  t=t.replace(/^'+/,'').replace(/^["\u201c]+|["\u201d]+$/g,'');
  if(/^(n\/?a|nan|null|nil|none|-+|\.+|err(or)?|\?+|void|invalid|#.*)$/i.test(t))return null;
  m=/[-+]?(?:\d+(?:[.,]\d+)*|[.,]\d+)(?:[eE][-+]?\d+)?/.exec(t);
  if(!m)return NaN;
  u=m[0];ei=u.search(/[eE]/);if(ei>0){e=u.substr(ei);u=u.substr(0,ei)}
  if(u.indexOf(',')>=0&&u.indexOf('.')>=0){
    if(u.lastIndexOf(',')>u.lastIndexOf('.'))u=u.replace(/\./g,'').replace(',','.');else u=u.replace(/,/g,'')}
  else if(u.indexOf(',')>=0){
    if(/^[-+]?[1-9]\d{0,2}(,\d{3})+$/.test(u))u=u.replace(/,/g,'');else u=u.replace(/,/g,'.')}
  u=Number(u+e);
  return isFinite(u)?u:NaN}
function mkDate(y,m,d){var dt;if(y<100)y+=2000;if(m<1||m>12||d<1||d>31||y<1990||y>2100)return '';
  dt=new Date(Date.UTC(y,m-1,d));if(dt.getUTCMonth()!=m-1)return '';return y+'-'+pad(m)+'-'+pad(d)}
var MON=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
/* day-first (dd/mm/yyyy) like the rest of the app; also yyyy-mm-dd, 08-Oct-2026 and Excel serial numbers */
function parseDate(s){var t=cl(s),m,a,b,i,dt;
  if(t==='')return '';
  m=/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/.exec(t);if(m)return mkDate(+m[1],+m[2],+m[3]);
  m=/^(\d{1,2})[-\/.\s](\d{1,2})[-\/.\s](\d{2,4})$/.exec(t);
  if(m){a=+m[1];b=+m[2];if(b>12&&a<=12)return mkDate(+m[3],a,b);return mkDate(+m[3],b,a)}
  m=/^(\d{1,2})[-\/.\s]+([A-Za-z]{3,9})[-\/.,\s]+(\d{2,4})$/.exec(t);
  if(m){i=MON.indexOf(m[2].substr(0,3).toLowerCase());if(i>=0)return mkDate(+m[3],i+1,+m[1])}
  m=/^(\d{5})(?:\.\d+)?$/.exec(t);
  if(m){a=+m[1];if(a>30000&&a<80000){dt=new Date(Date.UTC(1899,11,30)+a*86400000);return mkDate(dt.getUTCFullYear(),dt.getUTCMonth()+1,dt.getUTCDate())}}
  return ''}
function hourOf(t){var m=/^(\d{1,2}):(\d{2})(?::\d{2}(?:\.\d+)?)?\s*([AaPp][Mm])?$/.exec(t),h;
  if(m){h=+m[1];if(m[3]){h=h%12;if(/p/i.test(m[3]))h+=12}return h<24?h:-1}
  m=/^(\d{1,2})$/.exec(t);if(m&&+m[1]<24)return +m[1];
  return -1}
function stampOf(s){var t=cl(s),m=/^(.*\S)[\sT]+(\d{1,2}:\d{2}(?::\d{2}(?:\.\d+)?)?(?:\s*[AaPp][Mm])?)$/.exec(t),d,h;
  if(m){d=parseDate(m[1]);h=hourOf(m[2]);if(d&&h>=0)return{d:d,h:h}}
  h=hourOf(t);if(h>=0)return{d:'',h:h};
  return null}
function normH(s){return cl(s).replace(/[\u2080-\u2089]/g,function(ch){return ''+(ch.charCodeAt(0)-8320)}).toLowerCase()}
var SENS=[/^pm\s*[-_]?2[._,]?5/,/^pm\s*[-_]?10/,/^tsp/,/^so\s*2/,/^no\s*2/,/^voc/,/^temp/,/^(humid|rh)/,/^press/,/^h\s*2\s*s/,/^co\s*2/];
function hdrMap(cells){var map={t:-1,d:-1,c:[]},j,c,n,f=0,x;
  for(j=0;j<11;j++)map.c.push(-1);
  for(c=0;c<cells.length;c++){n=normH(cells[c]);if(n==='')continue;
    for(j=0;j<11;j++)if(map.c[j]<0&&SENS[j].test(n)){map.c[j]=c;f++;break}
    if(map.t<0&&/^(time|hour|timestamp|date\s*[\/&]?\s*time|datetime)/.test(n))map.t=c;
    else if(map.d<0&&/^date$/.test(n))map.d=c}
  if(f<3)return null;
  if(map.t<0)map.t=(map.d===0?1:0);
  return map}
function detectDelim(lines){var i,l,c,best=',',bn=-1,ds=[',',';','\t'],j,n;
  for(i=0;i<lines.length;i++)if(/pm\s*[-_]?2[._,]?5/i.test(normH(lines[i]))&&/tsp|pm\s*10/i.test(lines[i])){l=lines[i];
    for(j=0;j<3;j++){n=l.split(ds[j]).length-1;if(n>bn){bn=n;best=ds[j]}}return best}
  for(j=0;j<3;j++){n=0;for(i=0;i<lines.length;i++)n+=lines[i].split(ds[j]).length-1;if(n>bn){bn=n;best=ds[j]}}
  return best}
function splitLine(s,d){var o=[],c='',q=false,i,ch;
  for(i=0;i<s.length;i++){ch=s.charAt(i);
    if(q){if(ch=='"'){if(s.charAt(i+1)=='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch=='"')q=true;else if(ch==d){o.push(c);c=''}else c+=ch}
  o.push(c);return o}
function zeros(){var a=[],h,j,r;for(h=0;h<24;h++){r=[];for(j=0;j<11;j++)r.push(0);a.push(r)}return a}
function blank(){var a=[],h,j,r;for(h=0;h<24;h++){r=[];for(j=0;j<11;j++)r.push(null);a.push(r)}return a}
function hasAny(a){var h,j;for(h=0;h<24;h++)for(j=0;j<11;j++)if(a[h][j]!==null&&a[h][j]!==undefined)return true;return false}
/* Reads the AQMS CSV layout (title lines, Date line, Time header, hourly rows, 24-HR AVG / SEPA LIMIT rows)
   and also plain tables (Date,Time,PM2.5,...) or "08/10/2026 13:00" stamps. Several readings inside one
   hour are averaged. Returns {days:[{date,rows,hours,vals}],warns:[...]} */
function parseAQMS(text){
  var res={days:[],warns:[]},lines=(''+text).replace(/^\ufeff/,'').split(/\r\n|\r|\n/),d=detectDelim(lines),
      map=null,cur='',last='',acc={},avgs={},i,j,c,cells,c0,st,dt,v,bad=0,dup={},n,a,k,ks,rows,vs,hs,x,ti,tol,wl=[];
  function warn(t){if(wl.length<15)wl.push(t);else bad++}
  for(i=0;i<lines.length;i++){
    if(/^[\s,;\t"]*$/.test(lines[i]))continue;
    cells=splitLine(lines[i],d);c0=normH(cells[0]);
    x=hdrMap(cells);
    if(x){map=x;continue}
    if(/^date\b/.test(c0)){dt='';for(c=1;c<cells.length;c++){dt=parseDate(cells[c]);if(dt){cur=dt;last=dt;break}}if(dt)continue}
    if(!map)continue;
    if(/avg|average|mean/.test(c0)){if(last){a=[];for(j=0;j<11;j++)a.push(map.c[j]>=0?cleanNum(cells[map.c[j]]):null);avgs[last]=a}continue}
    if(/limit|sepa|^min|^max|^total|^sum|^count/.test(c0))continue;
    st=null;
    if(map.d>=0){dt=parseDate(cells[map.d]);ti=hourOf(cl(cells[map.t]));if(dt&&ti>=0)st={d:dt,h:ti}}
    if(!st)st=stampOf(cells[map.t]);
    if(!st){n=0;for(j=0;j<11;j++)if(map.c[j]>=0&&typeof cleanNum(cells[map.c[j]])=='number'&&!isNaN(cleanNum(cells[map.c[j]])))n++;
      if(n>=3)warn('Line '+(i+1)+' skipped: could not read the time "'+cl(cells[map.t])+'"');continue}
    dt=st.d||cur;if(!dt){warn('Line '+(i+1)+' skipped: no date found for it');continue}
    if(st.d){last=st.d}else{last=dt}
    if(!acc[dt])acc[dt]={s:zeros(),n:zeros()};

  h+='<div class="lbl">SENSORS'+(D.days[SEL]?' ('+dmy(SEL)+')':'')+'</div><div class="sn'+(S<0?' on':'')+'" onclick="selS(-1)"><span class="dot" style="background:'+P.tx+'"></span>All Sensors</div>';
  for(i=0;i<11;i++){v=D.days[SEL]?dav(SEL,i):null;h+='<div class="sn'+(S==i?' on':'')+'" onclick="selS('+i+')"><span class="dot" style="background:'+CL[i]+'"></span>'+SN[i][0]+'<b style="color:'+okc(v,i)+'">'+f(v,i)+'</b></div>'}
  h+='<div style="margin-top:12px"><button class="btn" style="width:100%" onclick="exportCSV()">Export to Excel (CSV)</button></div><div style="margin-top:6px"><button class="btn" style="width:100%" onclick="refreshNow()">Refresh data</button></div><div class="note" id="st">'+MSG+'</div><div class="note">Data updated: '+LASTM+'</div><div class="lbl">CLOUD</div><div class="note" id="cs">'+cmHtml()+'</div><div class="lbl">THEME / COLOUR</div>';
  for(i in TH)h+='<button class="btn" style="margin:0 5px 5px 0" onclick="setTheme(\''+i+'\')">'+TH[i].n+'</button>';
  document.getElementById('side').innerHTML=h;
}
function fit(){var b=document.getElementById('fzb'),h=document.getElementById('fzh');if(b&&h)h.style.paddingRight=(b.offsetWidth-b.clientWidth)+'px'}
function render(){metrics();side();var m={day:vDay,range:vRange,month:vMonth,edit:vEdit,cloud:vCloud};document.getElementById('content').innerHTML=m[V]();fit();autoLoad()}
window.onresize=fit;
function tick(){var d=new Date();document.getElementById('clk').innerHTML=pad(d.getDate())+'-'+pad(d.getMonth()+1)+'-'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())}
init();render();tick();setInterval(tick,1000);setInterval(watch,20000);
cloudStart();setInterval(function(){if(cloudOn()&&V!='edit'){PULLED={};autoLoad();flush()}},300000);
</script>
